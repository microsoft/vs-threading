    "https://aka.ms/spot",
    "https://msrc.microsoft.com/*",
    "https://www.microsoft.com/msrc*",
    "https://microsoft.com/msrc*",
    "https://www.npmjs.com/package/*",
    "https://get.dot.net/",
]
